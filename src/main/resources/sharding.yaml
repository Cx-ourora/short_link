# 新分片规则
rules:
  - !SHARDING
    tables:
      short_url_mapping:
        actualDataNodes: ds_$->{0..31}.short_url_mapping_$->{0..63}
        databaseStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: new-database-hash
        tableStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: new-table-hash
    shardingAlgorithms:
      new-database-hash:
        type: INLINE
        props:
          algorithm-expression: ds_$->{((short_code.hashCode() & 0x7fffffff) >> 8) % 32}
      new-table-hash:
        type: INLINE
        props:
          algorithm-expression: short_url_mapping_$->{(short_code.hashCode() & 0x7fffffff) % 64}

# 属性配置
props:
  sql-show: true
  sql-simple: true
