global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'short-link'
    static_configs:
      - targets: ['v8dc8537.natappfree.cc']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    scrape_timeout: 30s
    # 添加健康检查
    params:
      format: ['prometheus']
    # 重试机制
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        target_label: 'service'
        replacement: 'short-link'