global:
  smtp_smarthost: 'smtp.163.com:465'
  smtp_from: 'a15318098325@163.com'
  smtp_auth_username: 'a15318098325@163.com'
  smtp_auth_password: '授权码'
  smtp_require_tls: false

templates:
  - 'D:/tools/alertmanager-0.33.1.windows-amd64/email.tmpl'

route:
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'multi-notifications'
  routes:
    # 严重告警同时发送邮件和钉钉
    - match:
        severity: critical
      receiver: 'critical-notifications'
    # 普通告警只发钉钉
    - match:
        severity: warning
      receiver: 'dingtalk-notifications'

receivers:
  # 多渠道通知（邮件+钉钉）
  - name: 'multi-notifications'
    email_configs:
      - to: 'a15318098325@163.com'
        headers:
          Subject: '{{ template "email.subject" . }}'
        html: '{{ template "email.html" . }}'
    webhook_configs:
      - url: 'http://127.0.0.1:8060/dingtalk/webhook1/send'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alert'
            password: 'webhook123'

  # 严重告警通知
  - name: 'critical-notifications'
    email_configs:
      - to: 'a15318098325@163.com'
        headers:
          Subject: '🚨 CRITICAL: {{ template "email.subject" . }}'
        html: '{{ template "email.html" . }}'
    webhook_configs:
      - url: 'http://127.0.0.1:8060/dingtalk/webhook1/send'
        send_resolved: true

  # 钉钉通知
  - name: 'dingtalk-notifications'
    webhook_configs:
      - url: 'http://127.0.0.1:8060/dingtalk/webhook1/send'
        send_resolved: true